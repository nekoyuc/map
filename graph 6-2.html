<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Force-Directed Tree</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>

    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            // Replace this with the actual path or URL of your JSON file
            const jsonPath = 'data6.json';

            // Load data using Fetch API
            const response = await fetch(jsonPath);
            const data = await response.json();

            // Specify the chart’s dimensions.
            const width = 600;
            const height = 600;

            // Create the container SVG.
            const svg = d3.create("svg")
                .attr("width", width)
                .attr("height", height);

            // Compute the tree layout.
            const treeLayout = d3.tree().size([width, height]);

            // Convert the data to a hierarchy.
            const root = d3.hierarchy(data);

            // Assign coordinates to each node.
            treeLayout(root);

            // Append links.
            svg.selectAll("path.link")
                .data(root.links())
                .join("path")
                .attr("class", "link")
                .attr("d", d3.linkHorizontal()
                    .x(d => d.y)
                    .y(d => d.x));

            // Append nodes.
            const node = svg.selectAll("g.node")
                .data(root.descendants())
                .join("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${d.y},${d.x})`);

            node.append("circle")
                .attr("r", 4.5);

            node.append("text")
                .attr("dy", "0.31em")
                .attr("x", d => d.children ? -6 : 6)
                .attr("text-anchor", d => d.children ? "end" : "start")
                .text(d => d.data.name);

            // Append the SVG to the body
            document.body.appendChild(svg.node());
        });
    </script>

</body>

</html>
