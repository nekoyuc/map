<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Graph</title>
</head>

<body>
    <script src="d3.v7.min.js"></script>
    <script src="controller_functions.js"></script>
    <script src="view_elements_resources.js"></script>
    <script>
        const data = JSON.parse(localStorage.getItem('localData'));
        console.log("Hello world");

        const createForceDirectedGraph = (data) => {
            nodeGraph.on("mouseover", handleMouseOver)
                .on("mouseout", handleMouseOut)
            simulation.on("tick", () => {
                nodeGraph
                    .attr("cx", d => d.x)
                    .attr("cy", d => d.y)
                linkGraph
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y)
                nodeLabels
                    .attr("x", d => d.x)
                    .attr("y", d => d.y);
            });

            // Append the SVG to the body
            document.body.appendChild(svg.node());
            svg.on("click", () => {
                descripToggle = !descripToggle;
            });
            svg.call(zoom)
        }

        // Create the force simulation
        var simulation = d3.forceSimulation(data.nodes)
            .force("link", d3.forceLink(data.links).id(d => d.id).distance(100).strength(0.5))
            .force("charge", d3.forceManyBody().strength(-100))
            .force("x", d3.forceX())
            .force("y", d3.forceY());

        // Function to handle drag events
        const drag = (simulation) => {
            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }
            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }
            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }
            return d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended);
        }

        // Create the initial graph
        updateLinkGraph(data.links)
        updateNodeGraph(data.nodes)
        updateNodeLabels(data.nodes)
        updateFlairButtons(data.nodes.filter(d => d.type === "Flairs"))

        // Create the graph
        createForceDirectedGraph(data);
    </script>
</body>

</html>
