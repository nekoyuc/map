<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Force-Directed Graph</title>
    <script src="d3.v7.min.js"></script>
    <script type="module">

        // Function to create the force-directed graph
        const createForceDirectedGraph = (data) => {
            // Specify the chart’s dimensions.
            const chartWidth = 1200;
            const chartHeight = 800;
            const descriptionWidth = 300;
            const descriptionHeight = 200;
            const descriptionOffsetX = 50; // Offset the description window horizontally
            const descriptionOffsetY = -50; // Offset the description window vertically

            // Compute the graph and start the force simulation.
            const root = d3.hierarchy(data);
            const links = root.links();
            const nodes = root.descendants();

            const simulation = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(links).id(d => d.id).distance(70).strength(1))
                .force("charge", d3.forceManyBody().strength(-50))
                .force("x", d3.forceX())
                .force("y", d3.forceY());

            // Create the container SVG.
            const svg = d3.create("svg")
                .attr("width", chartWidth)
                .attr("height", chartHeight)
                .attr("viewBox", [-chartWidth / 2, -chartHeight / 2, chartWidth, chartHeight])
                .attr("style", "max-width: 100%; height: auto;")
                .call(d3.zoom().on("zoom", zoomed));

            // Append a rectangle as the boundary line.
            svg.append("rect")
                .attr("x", -chartWidth / 2)
                .attr("y", -chartHeight / 2)
                .attr("width", chartWidth)
                .attr("height", chartHeight)
                .attr("stroke", "#999")
                .attr("stroke-width", 1)
                .attr("fill", "none");

            // Append links.
            const link = svg.append("g")
                .attr("stroke", "#999")
                .attr("stroke-opacity", 0.6)
                .selectAll("line")
                .data(links)
                .join("line");

            // Append nodes.
            const node = svg.append("g")
                .attr("fill", "#fff")
                .attr("stroke", "#000")
                .attr("stroke-width", 1.5)
                .selectAll("circle")
                .data(nodes)
                .join("circle")
                .attr("fill", d => d.children ? null : "#000")
                .attr("stroke", d => d.children ? null : "#fff")
                .attr("r", 7)
                .call(drag(simulation))
                .on("mouseover", handleMouseOver)
                .on("mouseout", handleMouseOut);

            node.append("title")
                .text(d => d.data.name);

            // Append node labels.
            const nodeLabels = svg.append("g")
                .attr("class", "node-labels")
                .selectAll("text")
                .data(nodes)
                .join("text")
                .attr("class", "node-label")
                .attr("text-anchor", "middle")
                .attr("dy", "-0.5em")
                .attr("font-size", d3.scaleLinear().domain([0, 1]).range([2, 4]).clamp(true)(1))
                .attr("font-family", "helvetica") // Set the font family to "helvetica
                .attr("fill", "#19A") // Set the text color to green blue
                .attr("font-weight", "bold") // Set the text to bold
                .text(d => d.data.name)
                .style("display", "none");

            simulation.on("tick", () => {
                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node
                    .attr("cx", d => d.x)
                    .attr("cy", d => d.y);

                nodeLabels
                    .attr("x", d => d.x)
                    .attr("y", d => d.y)
                    .style("display", d => d3.zoomTransform(svg.node()).k >= 3 ? "block" : "none");
            });

            // Function to handle mouseover event
            function handleMouseOver(event, d) {
                d3.select(this)
                    .attr("r", 12)
                    .attr("fill", "#f00");

                simulation.stop(); // Pause the simulation

                // Display the description window
                descriptionWindow.style("display", "block");
                descriptionWindow.style("top", `${event.pageY + descriptionOffsetY}px`);
                descriptionWindow.style("left", `${event.pageX + descriptionOffsetX}px`);
                
                // Set the description content to include both "value" and "url" attributes if "url" exists
                let descriptionContentHtml = `<strong>Value:</strong> ${d.data.value}`;
                if (d.data.url) {
                    descriptionContentHtml += `<br><strong>URL:</strong> <a href="${d.data.url}" target="_blank">${d.data.url}</a>`;
                }
                descriptionContent.html(descriptionContentHtml);
            }

            // Function to handle mouseout event
            function handleMouseOut(event, d) {
                d3.select(this)
                    .attr("r", 7)
                    .attr("fill", d => d.children ? null : "#000");

                simulation.restart(); // Resume the simulation

                if (!descriptionToggle) {
                    descriptionWindow.style("display", "none");
                }

                descriptionToggle = false;
            }

            // Function to handle zoom event
            function zoomed(event) {
                const { transform } = event;
                const mouseX = event.sourceEvent.offsetX - chartWidth / 2;
                const mouseY = event.sourceEvent.offsetY - chartHeight / 2;
                const scale = transform.k;
                const translateX = -mouseX * (scale - 1);
                const translateY = -mouseY * (scale - 1);

                svg.attr("transform", `translate(${translateX}, ${translateY}) scale(${scale})`);

                nodeLabels.style("display", d => transform.k >= 2 ? "block" : "none");
                node.attr("stroke-width", 1.5 / transform.k);
            }

            // Set the maximum zoom-out extent
            const zoom = d3.zoom()
                .scaleExtent([1, 4])
                .on("zoom", zoomed);

            // Append the SVG to the body
            document.body.appendChild(svg.node());

            // Append the description window.
            const descriptionWindow = d3.select("body")
                .append("div")
                .attr("class", "description-window")
                .style("position", "absolute")
                .style("display", "none")
                .style("width", `${descriptionWidth}px`)
                .style("height", `${descriptionHeight}px`)
                .style("border", "1px solid #000")
                .style("border-radius", "5px")
                .style("background-color", "#fff");

            const descriptionContent = descriptionWindow.append("div")
                .attr("class", "description-content")
                .style("padding", "10px")
                .style("word-wrap", "break-word");
            // Mouse click toggle for description window
            let descriptionToggle = false;
            svg.on("click", () => {
                descriptionToggle = !descriptionToggle;
            });

            // Call the zoom function on the SVG
            svg.call(zoom);
        }

        // Load data using FileAttachment
        const response = await fetch("data6.json");
        const data = await response.json();

        // Function to handle drag events
        const drag = (simulation) => {
            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }

            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }

            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }

            return d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended);
        }

        // Call the function with the loaded data
        createForceDirectedGraph(data);
    </script>
</head>

</html>
