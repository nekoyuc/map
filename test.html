<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST</title>
    <script src="d3.v7.min.js"></script>
    <script type="module">
        // Load data using FileAttachment
        const response = await fetch("ProjectLibrary_data.json");
        const data = await response.json();

        const svg = d3.create("svg")
            .attr("width", 1800)
            .attr("height", 900)
            .attr("viewBox", [-1800 / 2, -900 / 2, 1800, 900])
            .attr("style", "max-width: 100%; height: auto; position: absolute; left: 60;")

        svg.append("rect")
            .attr("x", -1800 / 2)
            .attr("y", -900 / 2)
            .attr("width", 1800)
            .attr("height", 900)
            .attr("stroke", "#999")
            .attr("stroke-width", 1)
            .attr("fill", "none");

            document.body.appendChild(svg.node());

        var old_links = [{
            "source": "大坂",
            "target": "Umeda Sky Building",
            "group": "___is the location of___"
        },
        {
            "source": "super tall",
            "target": "Umeda Sky Building",
            "group": "___is the flair of___"
        },
        {
            "source": "David Mignot",
            "target": "City Pattern",
            "group": "___is the author of___"
        },
        {
            "source": "David Mignot",
            "target": "Natural artifact",
            "group": "___is the author of___"
        },
        {
            "source": "digital art",
            "target": "City Pattern",
            "group": "___is the flair of___"
        }
        ];

        var old_nodes = [{
            "id": "City Pattern",
            "name": "City Pattern",
            "url": "https://www.idflood.com/2019/03/city-pattern/",
            "type": "Visuals",
            "description": ""
        },
        {
            "id": "David Mignot",
            "name": "David Mignot",
            "url": "https://www.idflood.com/",
            "type": "Companies/Individuals",
            "description": ""
        },
        {
            "id": "Natural artifact",
            "name": "Natural artifact",
            "url": "https://knownorigin.io/gallery/226325-natural-artifact",
            "type": "Visuals",
            "description": ""
        },
        {
            "id": "digital art",
            "name": "digital artsss",
            "type": "Flairs",
            "description": ""
        },
        {
            "id": "Zaha Hadid",
            "name": "Zaha Hadid",
            "type": "Companies/Individuals",
            "description": ""
        }];

        let linkGraph = svg.append("g")
            .selectAll("line")
            .data(old_links)
            .join("line");

        let nodeGraph = svg.append("g")
            .selectAll("circle")
            .data(old_nodes)
            .join("circle")
            .attr("r", 5)
            .attr("fill", "black");

        // Replace old data with new data
        linkGraph = linkGraph.data(data.links).join("line");
        linkGraph.enter().append("line");
        linkGraph.exit().remove();

        nodeGraph = nodeGraph.data(data.nodes).join("circle");
        nodeGraph.enter().append("circle").attr("r", 5).attr("fill", "black");
        nodeGraph.exit().remove();

        console.log("linkGraph is " + linkGraph.data());
    </script>
</head>

</html>
