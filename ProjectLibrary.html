<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Force-Directed Graph</title>
    <script src="d3.v7.min.js"></script>
    <script type="module">

        // Specify the chart’s dimensions.
        const chartWidth = 1200;
        const chartHeight = 800;

        // Set the colors for different node types
        const architectureColor = "#d69d69";
        const locationsColor = "#93e18a";
        const flairsColor = "#eaeb81";
        const companiesIndividualsColor = "#a64d64";
        const visualsColor = "#5a7699";
        const audioColor = "#7ea5d4";
        const otherColor = "#a3a3a3";

        // Set the colors for different link groups
        const authorLinkColor = companiesIndividualsColor;
        const locationLinkColor = locationsColor;
        const flairLinkColor = flairsColor;
        const otherLinkColor = otherColor;

        // Set the color for node labels
        const nodeLabelColor = "#3d3d3d";

        // Set the description window dimensions and offsets
        const descripWidth = 800;
        const descripHeight = 700;
        const descripOffsetX = 50; // Offset the description window horizontally
        const descripOffsetY = -50; // Offset the description window vertically

        // Set the node sizes
        const projectNodeSize = 13;
        const hoveredProjectNodeSize = 16;
        const topicNodeSize = 10;
        const hoveredTopicNodeSize = 13;
        const flairNodeSize = 6;
        const hoveredFlairNodeSize = 8;

        // Set node and link flair styles
        const nodeNormalOpacity = 1;
        const nodeDisconnectedOpacity = 0.1;
        const linkNormalOpacity = 0.4;
        const linkNormalWidth = 2;
        const linkDisconnectedOpacity = 0.1;
        const linkConnectedOpacity = 0.7;
        const linkConnectedWidth = 3;

        // Set node label display extent
        const nodeLabelDisplayExtent = 1.8;

        // Set toggles
        let lastHoveredColor = null;
        let lastClickedButtonIcon = null;
        let descripToggle = false;

        // Load data using FileAttachment
        const response = await fetch("ProjectLibrary_data.json");
        const data = await response.json();

        console.log(data);
        console.log(data.links);

        // Compute the graph and start the force simulation.
        const nodes = data.nodes;
        const links = data.links;

        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(100).strength(0.5))
            .force("charge", d3.forceManyBody().strength(-100))
            .force("x", d3.forceX())
            .force("y", d3.forceY());

        // Function to handle drag events
        const drag = (simulation) => {
            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }
            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }
            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }
            return d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended);
        }

        // Create the container SVG.
        const svg = d3.create("svg")
            .attr("width", chartWidth)
            .attr("height", chartHeight)
            .attr("viewBox", [-chartWidth / 2, -chartHeight / 2, chartWidth, chartHeight])
            .attr("style", "max-width: 100%; height: auto;")
            .call(d3.zoom().on("zoom", zoomed));

        // Append link elements.
        const link = svg.append("g")
            .attr("stroke-opacity", linkNormalOpacity)
            .selectAll("line")
            .data(links)
            .join("line")
            .attr("stroke", d => d.group === "___is the author of___" ? authorLinkColor : (d.group === "___is the location of___" ? locationLinkColor : (d.group === "___is the flair of___" ? flairLinkColor : otherLinkColor)))
            .attr("stroke-width", linkNormalWidth);

        // Append node elements.
        const node = svg.append("g")
            .attr("stroke", "#fff")
            .attr("stroke-width", 0.6)
            .selectAll("circle")
            .data(nodes)
            .join("circle")
            .attr("fill", d => {
                if (d.type === "Locations") {
                    return locationsColor;
                } else if (d.type === "Architecture") {
                    return architectureColor
                } else if (d.type === "Flairs") {
                    return flairsColor;
                } else if (d.type === "Companies/Individuals") {
                    return companiesIndividualsColor;
                } else if (d.type === "Visuals") {
                    return visualsColor;
                } else if (d.type === "Audio") {
                    return audioColor;
                } else {
                    return otherColor;
                }
            }
            )
            .attr("r", d => d.type === "Flairs" ? flairNodeSize : (d.type === "Architecture" || d.type === "Visuals" || d.type === "Audio" ? projectNodeSize : topicNodeSize))
            .call(drag(simulation))

        // Append node labels.
        const nodeLabels = svg.append("g")
            .attr("class", "node-labels")
            .selectAll("text")
            .data(nodes)
            .join("text")
            .attr("class", "node-label")
            .attr("text-anchor", "middle")
            .attr("dy", "-0.35em")
            .attr("font-size", d3.scaleLinear().domain([0, 1]).range([2, 4]).clamp(true)(1))
            .attr("font-family", "Futura Bk BT") // Set the font family to "helvetica
            .attr("font-weight", "bold") // Set the text to bold
            .attr("label-id", d => d.id) // Add the attribute "id" with the value of the node's id
            .text(d => d.name)
            .style("display", "none")

        // Function to handle zoom event
        function zoomed(event) {
            const { transform } = event;
            const mouseX = event.sourceEvent.offsetX - chartWidth / 2;
            const mouseY = event.sourceEvent.offsetY - chartHeight / 2;
            const scale = transform.k;
            const translateX = -mouseX * (scale - 1);
            const translateY = -mouseY * (scale - 1);
            svg.attr("transform", `translate(${translateX}, ${translateY}) scale(${scale})`);
            nodeLabels.style("display", d => transform.k >= nodeLabelDisplayExtent ? "block" : "none");
        }

        // Set the maximum zoom-out extent
        const zoom = d3.zoom()
            .scaleExtent([1, 6])
            .on("zoom", zoomed);

        // Append the description window.
        const descripWindow = d3.select("body")
            .append("div")
            .attr("class", "description-window")
            .attr("window-id", "none")
            .attr("window-name", "none")
            .attr("window-url", "none")
            .attr("window-type", "none")
            .attr("window-description", "none")
            .style("position", "absolute")
            .style("display", "none")
            .style("width", `${descripWidth}px`)
            .style("height", `${descripHeight}px`)
            .style("border", "1px solid #000")
            .style("border-radius", "5px")
            .style("background-color", "#fff")
            .style("z-index", "100");
        const descripContent = descripWindow.append("div")
            .attr("class", "description-content")
            .style("padding", "10px")
            .style("word-wrap", "break-word")
            .style("max-width", "100%") // Set the maximum width to 100%
            .style("z-index", "100");

        // Append buttons for nodes with type Flair
        const flairButtonsContainer = d3.select("body")
            .insert("div", "svg")
            .attr("class", "buttons-container")
            .style("position", "absolute")
            .style("pointer-events", "none")
            .style("top", "0")
            .style("left", "0")
            .style("width", `${chartWidth}px`)
            .style("height", `${chartHeight}px`)
            .style("z-index", "999"); // Set the z-index to make it always in front of the chart
        const flairButtons = flairButtonsContainer.selectAll("button")
            .data(nodes.filter(d => d.type === "Flairs"))
            .join("button")
            .text(d => d.name)
            .attr("icon", d => d.name) // Set the name attribute to the node name
            .style("pointer-events", "auto")
            .on("click", flairClick);
        function flairClick(d) {
            node.attr("opacity", nodeNormalOpacity);
            link.attr("stroke-opacity", linkNormalOpacity);
            link.attr("stroke-width", linkNormalWidth);

            // If the button is clicked again, clear the filter
            if (d3.select(this).attr("icon") === lastClickedButtonIcon) {
                lastClickedButtonIcon = null;
            } else {
                const selectedNode = node.filter(nodeData => nodeData.name === d3.select(this).attr("icon"));

                const connectingLinks = link.filter(linkData => linkData.source.name === d3.select(this).attr("icon") || linkData.target.name === d3.select(this).attr("icon"));
                connectingLinks.attr("stroke-opacity", linkConnectedOpacity);
                connectingLinks.attr("stroke-width", linkConnectedWidth);

                const disconnectedLinks = link.filter(linkData => linkData.source.name !== d3.select(this).attr("icon") && linkData.target.name !== d3.select(this).attr("icon"));
                disconnectedLinks.attr("stroke-opacity", linkDisconnectedOpacity);

                const disconnectedNodes = node.filter(nodeData => {
                    const connectedNodes = connectingLinks.data().flatMap(linkData => [linkData.source, linkData.target]);
                    return !connectedNodes.some(connectedNode => connectedNode.name === nodeData.name);
                });
                disconnectedNodes.attr("opacity", nodeDisconnectedOpacity);

                // Update the last clicked button icon
                lastClickedButtonIcon = d3.select(this).attr("icon");
            }
        }

        // Append a button to clear all hihglighted nodes
        const clearButton = flairButtonsContainer.append("button")
            .text("Clear Filter")

            // Move the button to the right by 5px
            .style("position", "absolute")
            .style("top", "5px")
            .style("right", "-100px")

            .style("pointer-events", "auto")
            .on("click", () => {
                node.attr("opacity", 1);

                link.attr("stroke-width", 2);
                link.attr("stroke-opacity", 0.4);
                lastClickedButtonIcon = null;
            });




        // Function to create the force-directed graph
        const createForceDirectedGraph = (data) => {
            // Append a rectangle as the boundary line.
            svg.append("rect")
                .attr("x", -chartWidth / 2)
                .attr("y", -chartHeight / 2)
                .attr("width", chartWidth)
                .attr("height", chartHeight)
                .attr("stroke", "#999")
                .attr("stroke-width", 1)
                .attr("fill", "none");
            // Mouseover and mouseout event handlers for nodes
            node.on("mouseover", handleMouseOver)
                .on("mouseout", handleMouseOut);
            // Function to handle tick events.
            simulation.on("tick", () => {
                node
                    .attr("cx", d => d.x)
                    .attr("cy", d => d.y)
                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);
                nodeLabels
                    .attr("x", d => d.x)
                    .attr("y", d => d.y)
            });

            // Function to handle mouseover event
            function handleMouseOver(event, d) {
                descripWindow.selectAll("button").remove(); // Remove all buttons from the description window
                descripWindow.attr("window-id", d.id);
                descripWindow.attr("window-name", d.name);
                descripWindow.attr("window-url", d.url);
                descripWindow.attr("window-type", d.type);
                descripWindow.attr("window-description", d.descrip);

                lastHoveredColor = d3.select(this).attr("fill");

                d3.select(this)
                    .attr("r", d.type === "Flairs" ? hoveredFlairNodeSize : d.type === "Architecture" || d.type === "Visuals" || d.type === "Audio" ? hoveredProjectNodeSize : hoveredTopicNodeSize)
                    .attr("fill", "#808080");

                simulation.stop(); // Pause the simulation

                // Display the description window
                if (d.type !== "Flairs") {
                    descripWindow.style("display", "block");
                    descripWindow.style("top", `${event.pageY + descripOffsetY}px`);
                    descripWindow.style("left", `${event.pageX + descripOffsetX}px`);

                    // Set the description content to include both "description" and "url" attributes if "url" exists
                    let descripContentHtml = `<strong>Description:</strong> ${d.description}`;
                    if (d.url) {
                        descripContentHtml += `<br><strong>URL:</strong> <a href="${d.url}" target="_blank">${d.url}</a>`;
                        descripContentHtml += `<br><iframe src="${d.url}" width="100%" height=600px></iframe>`;
                    }
                    descripContent.html(descripContentHtml);

                    // Add buttons to the description window
                    const editButton = descripWindow.append("button")
                        .text("Edit")
                        .on("click", handleEditButtonClick)
                        .style("margin-left", "10px"); // Move the button 5px to the right

                    const deleteButton = descripWindow.append("button")
                        .text("Delete")
                        .on("click", handleDeleteButtonClick)
                        .style("margin-left", "10px"); // Move the button 5px to the right

                }
            }

            // Function to handle mouseout event
            function handleMouseOut(event, d) {
                d3.select(this)
                    .attr("r", d => d.type === "Flairs" ? flairNodeSize : d.type === "Architecture" || d.type === "Visuals" || d.type === "Audio" ? projectNodeSize : topicNodeSize)
                    .attr("fill", lastHoveredColor);

                simulation.restart(); // Resume the simulation

                if (!descripToggle) {
                    descripWindow.style("display", "none");
                }

                descripToggle = false;
                // Remove the buttons from the description window
            }

            // Append the SVG to the body
            document.body.appendChild(svg.node());

            svg.on("click", () => {
                descripToggle = !descripToggle;
            });

            // Call the zoom function on the SVG
            svg.call(zoom);

            // Function to handle button 1 click event
            function handleEditButtonClick() {
                const targetNode = data.nodes.find(node => node.id === descripWindow.attr("window-id"));
                const connectingLinks = link.filter(linkData => linkData.source.id === targetNode.id || linkData.target.id === targetNode.id);
                const connectedNodes = [...new Set(connectingLinks.data().flatMap(linkData => [linkData.source, linkData.target]))];
                const authorNodes = connectedNodes.filter(nodeData => nodeData.type === "Companies/Individuals");
                const locationNodes = connectedNodes.filter(nodeData => nodeData.type === "Locations");
                const flairNodes = connectedNodes.filter(nodeData => nodeData.type === "Flairs");

                console.log(connectingLinks.data());

                // Display all node attributes in the description window
                descripContent.html(`
                    <strong>ID:</strong> ${descripWindow.attr("window-id")}
                    <br><strong>Name:</strong> ${descripWindow.attr("window-name") ? descripWindow.attr("window-name") : ""}
                    <br><strong>Type:</strong> ${descripWindow.attr("window-type") ? descripWindow.attr("window-type") : ""}
                    <br><strong>Description:</strong> ${descripWindow.attr("window-description") ? descripWindow.attr("window-description") : ""}
                    <br><strong>URL:</strong> ${descripWindow.attr("window-url") ? descripWindow.attr("window-url") : ""}
                    <br><br><strong>Author:</strong> ${authorNodes.map(authorNode => authorNode.name).join(", ")}
                    <br><strong>Location:</strong> ${locationNodes.map(locationNode => locationNode.name).join(", ")}
                    <br><strong>Flairs:</strong> ${flairNodes.map(flairNode => flairNode.name).join(", ")}

                    <br><br><strong>Update name:</strong> <input type="text" id="name-input" value="${descripWindow.attr("window-name") ? descripWindow.attr("window-name") : ""}">
                    <br><strong>Update type:</strong> <input type="text" id="type-input" value="${descripWindow.attr("window-type") ? descripWindow.attr("window-type") : ""}">
                    <br><strong>Update description:</strong> <input type="text" id="description-input" value="${descripWindow.attr("window-description") ? descripWindow.attr("window-description") : ""}">
                    <br><strong>Update URL:</strong> <input type="text" id="url-input" value="${descripWindow.attr("window-url") ? descripWindow.attr("window-url") : ""}">

                    <br><br><strong>Update author:</strong> <input type="text" id="authors-input" value="${authorNodes.map(authorNode => authorNode.name).join(", ")}">
                    <br><strong>Update location:</strong> <input type="text" id="locations-input" value="${locationNodes.map(locationNode => locationNode.name).join(", ")}">
                    <br><strong>Update flairs:</strong> (separate flairs with ",") <input type="text" id="flairs-input" value="${flairNodes.map(flairNode => flairNode.name).join(", ")}">
                    `);

                const saveButton = descripWindow.append("button")
                    .text("Save")
                    .style("margin-left", "30px")
                    .on("click", () => {
                        if (targetNode) {
                            // Remove all author links from the data.links array
                            data.links = data.links.filter(linkData => !(linkData.target.id === targetNode.id && linkData.group === "___is the author of___"));

                            const newAuthorNames = document.getElementById("authors-input").value.split(",");
                            newAuthorNames.forEach(newAuthorName => {
                                const newAuthorNode = data.nodes.find(node => node.name === newAuthorName.trim());
                                if (newAuthorNode) {
                                    data.links.push({
                                        "source": newAuthorNode,
                                        "target": targetNode,
                                        "group": "___is the author of___",
                                        "index": data.links.length
                                    });
                                }
                            });

                            const nodes = data.nodes;
                            const links = data.links;


                            node.data(nodes);
                            link.data(links);

                            console.log("updated node" + node);
                            console.log("updated link" + link);

                            // Print size of link
                            console.log("data links length " + data.links.length);
                            console.log("link length " + link.data.length);

                            // Update nodes with data.nodes


                            // Update location links
                            /*
                            const locationLinks = link.filter(linkData => linkData.target.id === targetNode.id && linkData.group === "___is the location of___");
                            locationLinks.each(linkData => {
                                const index = data.links.indexOf(linkData);
                                if (index > -1) {
                                    data.links.splice(index, 1);
                                }
                            });
                            const newLocationNames = document.getElementById("locations-input").value.split(",");
                            newLocationNames.forEach(newLocationName => {
                                const newLocationNode = data.nodes.find(node => node.name === newLocationName.trim());
                                if (newLocationNode) {
                                    data.links.push({
                                        "source": newLocationNode,
                                        "target": targetNode,
                                        "group": "___is the location of___",
                                        "index": data.links.length
                                    });
                                }
                            });
                            */

                            link.attr("stroke", d => d.group === "___is the author of___" ? authorLinkColor : (d.group === "___is the location of___" ? locationLinkColor : (d.group === "___is the flair of___" ? flairLinkColor : otherLinkColor)));

                            console.log(data);
                            console.log(data.links);

                            targetNode.name = document.getElementById("name-input").value;
                            targetNode.type = document.getElementById("type-input").value;
                            targetNode.description = document.getElementById("description-input").value;
                            targetNode.url = document.getElementById("url-input").value;

                            const targetLabel = nodeLabels.filter(nodeLabel => nodeLabel.id === targetNode.id);
                            targetLabel.text(targetNode.name);

                            descripWindow.attr("window-name", targetNode.name);
                            descripWindow.attr("window-type", targetNode.type);
                            descripWindow.attr("window-description", targetNode.description);
                            descripWindow.attr("window-url", targetNode.url);

                            const connectingLinks = link.filter(linkData => linkData.source.id === targetNode.id || linkData.target.id === targetNode.id);
                            console.log(connectingLinks.data());
                            const connectedNodes = [...new Set(connectingLinks.data().flatMap(linkData => [linkData.source, linkData.target]))];
                            const authorNodes = connectedNodes.filter(nodeData => nodeData.type === "Companies/Individuals");

                            descripContent.html(`
                                    <strong>ID:</strong> ${descripWindow.attr("window-id")}
                                    <br><strong>Name:</strong> ${descripWindow.attr("window-name") ? descripWindow.attr("window-name") : ""}
                                    <br><strong>Type:</strong> ${descripWindow.attr("window-type") ? descripWindow.attr("window-type") : ""}
                                    <br><strong>Description:</strong> ${descripWindow.attr("window-description") ? descripWindow.attr("window-description") : ""}
                                    <br><strong>URL:</strong> ${descripWindow.attr("window-url") ? descripWindow.attr("window-url") : ""}

                                    <br><br><strong>Author:</strong> ${authorNodes.map(authorNode => authorNode.name).join(", ")}
                                    <br><strong>Location:</strong> ${locationNodes.map(locationNode => locationNode.name).join(", ")}
                                    <br><strong>Flairs:</strong> ${flairNodes.map(flairNode => flairNode.name).join(", ")}

                                    <br><br><strong>Update name:</strong> <input type="text" id="name-input" value="${descripWindow.attr("window-name") ? descripWindow.attr("window-name") : ""}">
                                    <br><strong>Update type:</strong> <input type="text" id="type-input" value="${descripWindow.attr("window-type") ? descripWindow.attr("window-type") : ""}">
                                    <br><strong>Update description:</strong> <input type="text" id="description-input" value="${descripWindow.attr("window-description") ? descripWindow.attr("window-description") : ""}">
                                    <br><strong>Update URL:</strong> <input type="text" id="url-input" value="${descripWindow.attr("window-url") ? descripWindow.attr("window-url") : ""}">

                                    <br><br><strong>Update author:</strong> <input type="text" id="authors-input" value="${authorNodes.map(authorNode => authorNode.name).join(", ")}">
                                    <br><strong>Update location:</strong> <input type="text" id="locations-input" value="${locationNodes.map(locationNode => locationNode.name).join(", ")}">
                                    <br><strong>Update flairs:</strong> (separate flairs with ",") <input type="text" id="flairs-input" value="${flairNodes.map(flairNode => flairNode.name).join(", ")}">
                                `);
                        }
                    })

                const backButton = descripWindow.append("button")
                    .text("Back")
                    .style("margin-left", "10px") // Move the button 5px to the right
                    .on("click", () => {
                        descripContent.html(`<strong>Description:</strong> ${descripWindow.attr("window-description")}
                                                    ${descripWindow.attr("window-url") ? `<br><strong>URL:</strong> <a href="${descripWindow.attr("window-url")}" target="_blank">${descripWindow.attr("window-url")}</a>` : ""}          
                                                    ${descripWindow.attr("window-url") ? `<br><iframe src="${descripWindow.attr("window-url")}" width="100%" height="600px"></iframe>` : ""}`);
                        saveButton.remove();
                        backButton.remove();
                    });
            }

            // Function to handle button 2 click event
            function handleDeleteButtonClick() {
                // Add your code here
            }
        }

        // Call the function with the loaded data
        createForceDirectedGraph(data);
    </script>
</head>
</html>
